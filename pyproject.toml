[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tom-research"
version = "0.1.0"
description = "Experiments extending ThoughtTracing with ideas from AutoToM"
requires-python = ">=3.12"
dependencies = [
  "numpy", "pandas", "openai", "requests", "tqdm", "tenacity",
  "python-dotenv", "rich", "colorful", "nltk", "scipy", "backoff",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: makes a few real API calls; run with --live (needs keys in .env)"]

[tool.hatch.build.targets.wheel]
packages = ["shared", "experiments"]